# Models (contact predictors). Rows + named presets, not per-run configs.
# ${VAR} expands against ecstasy.config.Settings.
#   runner          script under models/_runners/ run inside `env`
#   env             venv whose bin/python executes the runner
#   msa             none | per_chain (unpaired a3m, by seq-hash)
#                   | boltz_csv  (Boltz-2: LOCAL colabfold_search -> paired+unpaired per-chain
#                     CSV, by pair-hash; reproduces boltz --use_msa_server — a custom .a3m would
#                     drop ALL pairing)
#                   | complex    (MSA-Pairformer: LOCAL colabfold-local -> stitched complex a3m,
#                     by pair-hash; how the eval MSAs were made)
#                   | complex_api(MSA-Pairformer: ColabFold API fallback — NOT used for eval data)
#                   boltz_csv and complex share the search engine but are DIFFERENT pipelines
#                   for DIFFERENT models — never conflate. Full map: src/ecstasy/msa/README.md
#   infra           machine knobs that do NOT affect outputs (excluded from the variant id)
#   default_preset  preset used when --preset is omitted
#   presets         named output-affecting parameter sets; pick by name, tweak with --set

boltz2:
  runner: boltz2_runner.py
  env: ${ENVS_ROOT}/.venv-boltz
  msa: boltz_csv
  infra: {num_workers: 0, devices: 1, no_kernels: true}
  default_preset: full
  presets:
    full: {recycling_steps: 3, sampling_steps: 25, diffusion_samples: 1, contact_cutoff_bin: 19}
    fast: {recycling_steps: 1, sampling_steps: 10, diffusion_samples: 1, contact_cutoff_bin: 19}
    # FLOPs recycle sweep: ONLY recycling_steps varies; sampling/diffusion held at the
    # `full` defaults so the compute→P@K line isolates the recycle knob (plan §3, §6).
    r0: {recycling_steps: 0, sampling_steps: 25, diffusion_samples: 1, contact_cutoff_bin: 19}
    r1: {recycling_steps: 1, sampling_steps: 25, diffusion_samples: 1, contact_cutoff_bin: 19}
    r3: {recycling_steps: 3, sampling_steps: 25, diffusion_samples: 1, contact_cutoff_bin: 19}
    r5: {recycling_steps: 5, sampling_steps: 25, diffusion_samples: 1, contact_cutoff_bin: 19}

# Single-sequence Boltz-2 (no MSA): identical runner/presets to boltz2 but msa=none,
# so the runner emits `msa: empty` per chain. Isolates how much Boltz leans on its MSA
# (compare to boltz2 at each recycle) and is a clean single-seq baseline.
boltz2_nomsa:
  runner: boltz2_runner.py
  env: ${ENVS_ROOT}/.venv-boltz
  msa: none
  infra: {num_workers: 0, devices: 1, no_kernels: true}
  default_preset: r3
  presets:
    r0: {recycling_steps: 0, sampling_steps: 25, diffusion_samples: 1, contact_cutoff_bin: 19}
    r1: {recycling_steps: 1, sampling_steps: 25, diffusion_samples: 1, contact_cutoff_bin: 19}
    r3: {recycling_steps: 3, sampling_steps: 25, diffusion_samples: 1, contact_cutoff_bin: 19}
    r5: {recycling_steps: 5, sampling_steps: 25, diffusion_samples: 1, contact_cutoff_bin: 19}

esmfold:
  runner: esmfold_runner.py
  env: ${ENVS_ROOT}/.venv-esmfold
  msa: none
  default_preset: glinker32
  presets:
    # 32-residue poly-G linker + 512 positional-index skip between chains (multimer hack)
    glinker32: {num_recycles: 4, chain_linker_length: 32, residue_index_offset: 512, contact_cutoff_bin: 19}
    full: {num_recycles: 4, chain_linker_length: 25, residue_index_offset: 512, contact_cutoff_bin: 19}
    # FLOPs recycle sweep: ONLY num_recycles varies; linker/offset held at glinker32.
    r0: {num_recycles: 0, chain_linker_length: 32, residue_index_offset: 512, contact_cutoff_bin: 19}
    r1: {num_recycles: 1, chain_linker_length: 32, residue_index_offset: 512, contact_cutoff_bin: 19}
    r3: {num_recycles: 3, chain_linker_length: 32, residue_index_offset: 512, contact_cutoff_bin: 19}
    r5: {num_recycles: 5, chain_linker_length: 32, residue_index_offset: 512, contact_cutoff_bin: 19}

# ESM2 supervised contact head (facebookresearch/esm contact_prediction.ipynb), adapted
# for dimers with the same poly-G-linker multimer hack as ESMFold. ESM2 uses rotary
# (relative) positions, so the linker length *is* the positional skip — there is no
# separate residue_index_offset. The head emits a contact probability in [0, 1] directly
# (no distogram, no recycles); we keep the continuous score for P@K ranking. Dedicated
# lightweight venv: just torch + fair-esm (no openfold/esmfold stack), built by
# scripts/install/esm2.sh. torch pinned <2.6 so fair-esm's checkpoint torch.load (which
# omits weights_only=False) keeps working. Presets sweep model SIZE → the compute→P@K curve (analogous to the recycle sweeps).
esm2:
  runner: esm2_runner.py
  env: ${ENVS_ROOT}/.venv-esm2
  msa: none
  default_preset: t33_650M
  presets:
    t6_8M:    {model_name: esm2_t6_8M_UR50D,    chain_linker_length: 25}
    t12_35M:  {model_name: esm2_t12_35M_UR50D,  chain_linker_length: 25}
    t30_150M: {model_name: esm2_t30_150M_UR50D, chain_linker_length: 25}
    t33_650M: {model_name: esm2_t33_650M_UR50D, chain_linker_length: 25}
    t36_3B:   {model_name: esm2_t36_3B_UR50D,   chain_linker_length: 25}

mentos:
  runner: mentos_runner.py
  env: ${ENVS_ROOT}/.venv-mentos         # dedicated venv; mentos installed editable from /home/.../mentos
  msa: none
  # No checkpoint presets here. MENTOS checkpoints are concrete (paths, steps, recycles) and
  # live ONLY in the Notion benchmarking Registry (the source of truth). Select one by name:
  #     ecstasy run --dataset D --model mentos --checkpoint a5sgd6ul_s90k
  # load_model resolves the name -> {weights path, num_recycles, run_id} via registry.local.yaml
  # (run scripts/mentos-perf-benchmarking/notion_pull.py first). Nothing concrete is committed;
  # the run-dir variant is the checkpoint name (e.g. a5sgd6ul_s90k / a5sgd6ul_s90k_r0).

msa_pairformer:
  runner: msa_pairformer_runner.py
  env: ${ENVS_ROOT}/.venv-msa_pairformer   # dedicated venv; MSA_Pairformer installed editable from modules/msa_pairformer
  msa: complex
  default_preset: full
  presets:
    full:
      max_msa_depth: 512
      weights_dir: ${ECSTASY_ROOT}/weights/msa_pairformer
      hhfilter_bin: ${TOOLS_ROOT}/hhsuite/bin/hhfilter

# PLMGraph-Inter (Si & Yan, eLife 2024) — DRN's successor: same MSA/coevolution
# pipeline PLUS ESM-IF1 + GVP structure graphs, so it needs a per-chain PDB structure
# in addition to the boltz_csv MSA. struct_dir holds ESMFold monomers named
# <entry_id>_<chain_id>.pdb (generated as a prerequisite for sequence-only splits).
# Install: scripts/install/plmgraph_inter.sh. Outside the FLOPs-profiling scope.
plmgraph_inter:
  runner: plmgraph_inter_runner.py
  env: ${ENVS_ROOT}/plmgraph_inter
  msa: boltz_csv
  default_preset: full
  presets:
    full:
      struct_dir: ${DATA_ROOT}/structures/esmfold
      ccmpred_bin: ${TOOLS_ROOT}/ccmpred/bin/ccmpred
      alnstats_bin: ${TOOLS_ROOT}/metapsicov/bin/alnstats
      hhmake_bin: ${TOOLS_ROOT}/hhsuite/bin/hhmake
      hhfilter_bin: ${TOOLS_ROOT}/hhsuite/bin/hhfilter
      esm1b_weights: ${ECSTASY_ROOT}/weights/plmgraph_inter/esm/esm1b_t33_650M_UR50S.pt
      esm_msa1b_weights: ${ECSTASY_ROOT}/weights/plmgraph_inter/esm/esm_msa1b_t12_100M_UR50S.pt
      esmif_weights: ${ECSTASY_ROOT}/weights/plmgraph_inter/esm/esm_if1_gvp4_t16_142M_UR50.pt

# DeepInteract (Morehead et al., ICLR 2022) — DGL geometric transformer on two
# per-chain PDB structures + hhblits MSA features. Needs an HHsuite DB (hhsuite_db;
# uniclust30 for the real eval) and the trained ckpt; DSSP/PSAIA features are imputed
# when absent. Install: scripts/install/deepinteract.sh. Outside the FLOPs scope.
deepinteract:
  runner: deepinteract_runner.py
  env: ${ENVS_ROOT}/deepinteract
  msa: none
  default_preset: full
  presets:
    full:
      struct_dir: ${DATA_ROOT}/structures/esmfold
      ckpt: ${ECSTASY_ROOT}/weights/deepinteract/LitGINI-GeoTran-DilResNet.ckpt
      hhsuite_db: ${ECSTASY_ROOT}/weights/deepinteract/hhsuite_db/uniclust30_2018_08/uniclust30_2018_08
      hhsuite_bin: ${TOOLS_ROOT}/hhsuite/bin/hhblits

colabfold:
  runner: colabfold_runner.py
  env: ${ENVS_ROOT}/.venv-colabfold
  # none: colabfold_batch fetches/handles its own MSA via --msa-mode; the runner
  # never consumes the ecstasy MSA store.
  msa: none
  default_preset: single_seq
  presets:
    single_seq: {msa_mode: single_sequence, num_recycle: 3, contact_cutoff_bin: 19}
