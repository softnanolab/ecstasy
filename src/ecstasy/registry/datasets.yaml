# Evaluation datasets (interchain contact prediction). Rows, not classes.
# ${VAR} expands against ecstasy.config.Settings (DATA_ROOT/MENTOS_ROOT/...).
#   kind        loader class (mentos_square)
#   index       split index parquet (has a `split` column + `sequences`)
#   gt_root     per-entry ground-truth root (<gt_root>/<id[:2]>/<id>.pt)
#   split       which split column value to evaluate (mentos_square)
#   contact_bin Cβ-Cβ distance-bin threshold; bins < contact_bin are contacts

_mentos: &mentos
  kind: mentos_square
  gt_root: ${MENTOS_ROOT}/pdb/processed/data
  split: val
  # MUST match MENTOS's CONTACT_LABEL_THRESHOLD_BIN=19 (Cβ-Cβ ≤ 7.9375 Å, bin<19) so
  # interchain P@K/AUC are directly comparable to the MENTOS benchmark. bin<5 was a
  # far stricter, non-comparable GT (degenerate median P@K=0). Verified identical to
  # mentos.metrics.contact_prediction.metrics_inter_chain at bin 19.
  # The GT contact_map is 64 bins over 2.0–22.0 Å (width 0.3125 Å, -1 = unresolved),
  # so bin<19 is exactly 2.0 + 19*0.3125 = 7.9375 Å.
  contact_bin: 19

# MENTOS "recent-PP" val — the ONLY split MENTOS still ships (PR #266). It replaced the
# five earlier splits (seq_id_30 + the four deleaked val_* sets), whose parquets no
# longer exist under MENTOS_ROOT; those rows were removed rather than left dangling.
#
# 151 dimers, all 2-chain, 104–1006 residues (median 618). The index also carries the
# 23,463 PDB-train rows, so `split: val` is load-bearing.
#
# Built to replicate §A.2.10 "Comparison with Boltz-2" of the ESMFold2 paper (Candido
# et al. 2026, doi:10.64898/2026.06.03.729735) — verified constant-by-constant against
# splits/val/build_manifest.json:
#   * PDB released 2025-06-30 → 2026-01-21   (VAL_DATE_LOWER / VAL_DATE_UPPER)
#   * chains < 40 or complexes > 2048 res dropped (MIN_RESIDUES_PER_CHAIN / MAX_RESIDUES_VAL)
#   * MMseqs cluster @ 40% id, 0.8 cov, cov_mode 0 against PDB-train (DECONTAM_*)
#   * any val chain clustering with a train chain removes the WHOLE val complex
#     (mentos.data_processing.splits.recent_pp.leaked_val_ids)
# Boltz-2 trains on PDB pre-2023-06-01 (= SPLIT_DATE_CUTOFF), so this window is
# genuinely temporally held out for Boltz-2, ESMFold and ESM2 alike.
#
# Caveat when reporting: the paper's numbers on this dataset are DockQ pass rates over
# predicted 3D structures; ecstasy measures inter-chain P@K over a contact map. Only the
# dataset is shared — the figures are not comparable, only the relative ordering.
#
# dataset_version (sha256 of index.parquet): 4d504b7e91f5babc76dfefb98e2b4732ca25216eb4aa767224e0dd1a9d506fe0
recent_pp:
  <<: *mentos
  index: ${MENTOS_ROOT}/pdb/processed/splits/val/index.parquet

# `swap_chains: true` (chain-order permutation: (A,B)->(B,A) with the square GT
# reindexed to match) is still implemented by MentosSquareDataset — the old
# val_seq_pair_swapped row went away with its parquet, not the capability. A swapped
# row must have its OWN name: it needs its own run dir, and MSA store keys are
# order-dependent (pair_hash), so its MSAs regenerate from scratch.
