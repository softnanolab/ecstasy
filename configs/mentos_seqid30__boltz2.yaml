# Ecstasy benchmark config: Boltz-2 on MENTOS seq_id_30 val (interchain P@K).
benchmark: mentos_seqid30
model: boltz2
data_root: /projects/u6jv/boltz_benchmarking/DATA

model_config:
  # Python env with boltz installed from feat/extract-distogram-2.2.1 + mentos editable.
  # Will be replaced by `envs/boltz/` once scripts/install/boltz.sh is rewritten
  # for aarch64 + Python 3.12.
  env_path: /home/u6jv/harsh.u6jv/ecstasy/envs/.venv-boltz
  recycling_steps: 3
  sampling_steps: 25
  diffusion_samples: 1
  num_workers: 0
  no_kernels: true
  contact_cutoff_bin: 19      # < 7.81 A; matches the with-MSA mean P@K = 0.502 baseline
  # predict_limit: 2          # uncomment for end-to-end smoke; full run = all 1,511
