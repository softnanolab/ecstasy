# Ecstasy benchmark config: ColabFold (AlphaFold-2 multimer) on MENTOS seq_id_30 val.
benchmark: mentos_seqid30
model: colabfold
data_root: /projects/u6jv/boltz_benchmarking/DATA

model_config:
  env_path: /home/u6jv/harsh.u6jv/ecstasy/envs/.venv-colabfold
  msa_mode: mmseqs2_uniref_env  # uses ColabFold MSA server unless local mmseqs is configured
  num_recycle: 3
  num_models: 1
  num_relax: 0                  # no Amber relax for contact P@K (saves wallclock)
  model_type: alphafold2_multimer_v3
