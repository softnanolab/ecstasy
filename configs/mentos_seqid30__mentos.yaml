# Ecstasy benchmark config: MENTOS (single-sequence) on MENTOS seq_id_30 val.
#
# MENTOS is *our* model. Different experiment runs have different (config, weights)
# pairs, so the runtime values are not baked in here — pass them on the CLI:
#
#   ecstasy bench predict --config configs/mentos_seqid30__mentos.yaml \
#       --model_config /path/to/<experiment>.yaml \
#       --model_weights /path/to/<experiment>.ckpt
#
# These flags land under cfg["model_config"]["model_config_path"] and
# cfg["model_config"]["model_weights_path"] which the mentos runner reads.
benchmark: mentos_seqid30
model: mentos
data_root: /projects/u6jv/boltz_benchmarking/DATA

model_config:
  # Reuse the venv that already has mentos installed; replace with envs/mentos
  # once scripts/install/mentos.sh lands.
  env_path: /home/u6jv/harsh.u6jv/ecstasy/envs/.venv-boltz
  contact_threshold_bin: 5      # bins 0..4 = Cβ < 8 Å; matches MENTOS GT convention
  # predict_limit: 1            # uncomment for the smoke test
