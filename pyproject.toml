[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecstasy"
version = "0.1.0"
description = "Benchmarking toolkit for protein interchain-contact prediction models"
authors = [
    {name = "Harsh Agrawal", email = "harshagrawal.1312@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"

dependencies = [
    "biotite",
    "fire",
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "requests",
]

[project.scripts]
ecstasy = "ecstasy.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
]
# Structure/DockQ scoring. Deliberately NOT part of [dev]: DockQ ships a C extension
# and has no wheel for every platform+interpreter combination we use, so it compiles
# from source and needs Python development headers. Folding it into [dev] would break
# environment creation on any interpreter lacking them (both clusters' system pythons
# do lack them). Opt in with `.[structure]` on an interpreter that has headers -- a
# uv-managed one does; see BENCHMARKING.md.
structure = [
    "DockQ>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ecstasy" = ["*.json", "*.yaml", "*.yml", "*.toml", "*.txt", "*.md"]
"ecstasy.registry" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "installation: per-venv import/install checks (subprocess into each model venv)",
    "integration: end-to-end CLI tests that load models and produce contact.npz",
    "gpu: requires CUDA on the running process or a model subprocess",
    "slow: long-running (>5 min wallclock)",
    "model_boltz2: boltz2 predict smoke",
    "model_mentos: mentos predict smoke",
    "model_esmfold: esmfold predict smoke",
    "model_msa_pairformer: MSA Pairformer predict smoke",
    "model_colabfold: ColabFold (AF2) predict smoke",
    "model_plmgraph_inter: PLMGraph-Inter predict smoke",
    "model_deepinteract: DeepInteract predict smoke",
    "model_minifold: minifold predict smoke",
]
