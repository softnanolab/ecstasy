[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecstasy"
version = "0.1.0"
description = "A comprehensive protein structure prediction and analysis toolkit"
authors = [
    {name = "Harsh Agrawal", email = "harshagrawal.1312@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"

dependencies = [
    "biopython",
    "biotite",
    "numpy",
    "pandas",
    "pyarrow",
    "psutil",
    "requests",
    "seaborn",
    "tmtools",
    "jupyter",
    "pytest",
    "black",
    "DockQ",
    "tqdm",
    "fire",
    "pyyaml",
]

[project.scripts]
ecstasy = "ecstasy.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ecstasy" = ["*.json", "*.yaml", "*.yml", "*.toml", "*.txt", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "installation: per-venv import/install checks (subprocess into each model venv)",
    "integration: end-to-end CLI tests that load models and produce contact.npz",
    "gpu: requires CUDA on the running process or a model subprocess",
    "slow: long-running (>5 min wallclock)",
    "model_boltz2: boltz2 predict smoke",
    "model_mint: mint predict smoke",
    "model_esmfold: esmfold predict smoke",
    "model_msa_pairformer: MSA Pairformer predict smoke",
    "model_colabfold: ColabFold (AF2) predict smoke",
]
